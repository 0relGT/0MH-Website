<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>0MH Website</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #02040a;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            padding: 25px;
            text-align: center;
            background: #050817;
            border-bottom: 1px solid #0c00ff;
            box-shadow: 0 0 25px #0c00ff;
        }

        header h1 {
            margin: 0;
            color: white;
            text-shadow:
                0 0 5px #0c00ff,
                0 0 15px #0c00ff,
                0 0 30px #0c00ff;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .panel {
            background: #050817;
            border: 1px solid #0c00ff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 0 18px rgba(12, 0, 255, 0.45);
        }

        h2 {
            margin-top: 0;
            color: white;
            text-shadow: 0 0 10px #0c00ff;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 12px;
            background: #02040a;
            color: white;
            border: 1px solid #0c00ff;
            border-radius: 8px;
            outline: none;
        }

        input:focus,
        textarea:focus,
        select:focus {
            box-shadow: 0 0 12px #0c00ff;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            padding: 11px 18px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            background: #0c00ff;
            color: white;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 12px #0c00ff;
        }

        button:hover {
            box-shadow:
                0 0 10px #0c00ff,
                0 0 25px #0c00ff;
        }

        .hidden {
            display: none !important;
        }

        .categories {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .category-button {
            flex: 1 1 140px;
        }

        .post {
            background: #02040a;
            border: 1px solid #0c00ff;
            border-radius: 10px;
            padding: 18px;
            margin-top: 15px;
            box-shadow: 0 0 12px rgba(12, 0, 255, 0.35);
        }

        .post h3 {
            margin-top: 0;
            color: white;
            text-shadow: 0 0 8px #0c00ff;
        }

        .post-meta {
            color: #aaa;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .post-text {
            white-space: pre-wrap;
            line-height: 1.5;
        }

        .file-box {
            margin-top: 15px;
            padding: 12px;
            border: 1px solid #0c00ff;
            border-radius: 8px;
            background: #050817;
        }

        .file-box a {
            color: white;
            text-decoration: none;
            text-shadow: 0 0 8px #0c00ff;
        }

        .file-box a:hover {
            text-decoration: underline;
        }

        .select-file-wrapper {
            margin-top: 8px;
            margin-bottom: 12px;
        }

        .select-file-button {
            display: inline-block;
            padding: 11px 18px;
            background: #0c00ff;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 12px #0c00ff;
        }

        .select-file-button:hover {
            box-shadow:
                0 0 10px #0c00ff,
                0 0 25px #0c00ff;
        }

        #fileName {
            display: inline-block;
            margin-left: 10px;
            color: #aaa;
        }

        .message {
            margin-top: 10px;
            padding: 10px;
            border-radius: 8px;
            background: #050817;
            border: 1px solid #0c00ff;
        }
    </style>
</head>

<body>

<header>
    <h1>0MH Website</h1>
</header>

<div class="container">

    <section id="loginSection" class="panel">
        <h2>Login</h2>

        <input
            id="loginUsername"
            type="text"
            placeholder="Username"
        >

        <input
            id="loginPassword"
            type="password"
            placeholder="Password"
        >

        <button onclick="login()">Login</button>

        <div id="loginMessage" class="message hidden"></div>
    </section>

    <section id="registerSection" class="panel">
        <h2>Register</h2>

        <input
            id="registerUsername"
            type="text"
            placeholder="Username"
        >

        <input
            id="registerPassword"
            type="password"
            placeholder="Password"
        >

        <button onclick="register()">Register</button>

        <div id="registerMessage" class="message hidden"></div>
    </section>

    <section id="userSection" class="panel hidden">
        <h2>User</h2>

        <p id="userInfo"></p>

        <button onclick="logout()">Log out</button>
    </section>

    <section id="websiteSection" class="hidden">

        <div class="panel">
            <h2>Categories</h2>

            <div class="categories">

                <button
                    class="category-button"
                    onclick="selectCategory('all')"
                >
                    0rel’s Mods
                </button>

                <button
                    class="category-button"
                    onclick="selectCategory('libs')"
                >
                    libs
                </button>

                <button
                    class="category-button"
                    onclick="selectCategory('apk’s')"
                >
                    apk’s
                </button>

                <button
                    class="category-button"
                    onclick="selectCategory('Metadata’s')"
                >
                    Metadata’s
                </button>

                <button
                    class="category-button"
                    onclick="selectCategory('Rooting')"
                >
                    Rooting
                </button>

                <button
                    class="category-button"
                    onclick="selectCategory('Frida mods')"
                >
                    Frida mods
                </button>

                <button
                    class="category-button"
                    onclick="selectCategory('Root mods')"
                >
                    Root mods
                </button>

            </div>
        </div>

        <section
            id="createPostSection"
            class="panel hidden"
        >
            <h2>Create Post</h2>

            <select id="postCategory">
                <option value="all">0rel’s Mods</option>
                <option value="libs">libs</option>
                <option value="apk’s">apk’s</option>
                <option value="Metadata’s">Metadata’s</option>
                <option value="Rooting">Rooting</option>
                <option value="Frida mods">Frida mods</option>
                <option value="Root mods">Root mods</option>
            </select>

            <input
                id="postTitle"
                type="text"
                placeholder="Post title"
            >

            <textarea
                id="postText"
                placeholder="Post text"
            ></textarea>

            <div class="select-file-wrapper">

                <label
                    for="postFile"
                    class="select-file-button"
                >
                    Select File
                </label>

                <input
                    id="postFile"
                    type="file"
                    class="hidden"
                    onchange="showSelectedFile()"
                >

                <span id="fileName">
                    No file selected
                </span>

            </div>

            <button onclick="createPost()">
                Create Post
            </button>

            <div
                id="postMessage"
                class="message hidden"
            ></div>
        </section>

        <section
            id="staffSection"
            class="panel hidden"
        >
            <h2>Staff</h2>

            <button onclick="openStaff()">
                Open Staff Panel
            </button>
        </section>

        <section class="panel">
            <h2 id="postsTitle">0rel’s Mods</h2>

            <div id="posts">
                Loading...
            </div>
        </section>

    </section>

</div>

<script>
    let currentUser = null;
    let currentCategory = "all";

    // ========================================
    // STAFF CHECK
    // ========================================

    function isStaffUser(user = currentUser) {
        if (!user) {
            return false;
        }

        const role = String(user.role || "")
            .trim()
            .toLowerCase();

        const username = String(user.username || "")
            .trim()
            .toLowerCase();

        return (
            role === "admin" ||
            role === "owner" ||
            username === "0relgt"
        );
    }

    // ========================================
    // CHECK USER
    // ========================================

    async function checkUser() {
        try {
            const response = await fetch(
                "/api/me",
                {
                    credentials: "include"
                }
            );

            const data = await response.json();

            if (!data.loggedIn) {
                currentUser = null;

                document
                    .getElementById("loginSection")
                    .classList.remove("hidden");

                document
                    .getElementById("registerSection")
                    .classList.remove("hidden");

                document
                    .getElementById("userSection")
                    .classList.add("hidden");

                document
                    .getElementById("websiteSection")
                    .classList.add("hidden");

                document
                    .getElementById("createPostSection")
                    .classList.add("hidden");

                document
                    .getElementById("staffSection")
                    .classList.add("hidden");

                return;
            }

            currentUser = data.user;

            document
                .getElementById("loginSection")
                .classList.add("hidden");

            document
                .getElementById("registerSection")
                .classList.add("hidden");

            document
                .getElementById("userSection")
                .classList.remove("hidden");

            document
                .getElementById("websiteSection")
                .classList.remove("hidden");

            document
                .getElementById("userInfo")
                .textContent =
                `Logged in as ${currentUser.username} | Role: ${currentUser.role}`;

            if (isStaffUser()) {
                document
                    .getElementById("createPostSection")
                    .classList.remove("hidden");

                document
                    .getElementById("staffSection")
                    .classList.remove("hidden");
            } else {
                document
                    .getElementById("createPostSection")
                    .classList.add("hidden");

                document
                    .getElementById("staffSection")
                    .classList.add("hidden");
            }

            loadPosts();

        } catch (error) {
            console.error(
                "Check user error:",
                error
            );
        }
    }

    // ========================================
    // LOGIN
    // ========================================

    async function login() {
        const username =
            document
                .getElementById("loginUsername")
                .value
                .trim();

        const password =
            document
                .getElementById("loginPassword")
                .value;

        const message =
            document.getElementById(
                "loginMessage"
            );

        try {
            const response = await fetch(
                "/auth/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    credentials: "include",

                    body: JSON.stringify({
                        username,
                        password
                    })
                }
            );

            const data =
                await response.json();

            if (!response.ok || !data.success) {
                message.textContent =
                    data.message ||
                    "Login failed.";

                message.classList.remove(
                    "hidden"
                );

                return;
            }

            message.classList.add("hidden");

            await checkUser();

        } catch (error) {
            console.error(
                "Login error:",
                error
            );

            message.textContent =
                "Unable to connect to the server.";

            message.classList.remove(
                "hidden"
            );
        }
    }

    // ========================================
    // REGISTER
    // ========================================

    async function register() {
        const username =
            document
                .getElementById("registerUsername")
                .value
                .trim();

        const password =
            document
                .getElementById("registerPassword")
                .value;

        const message =
            document.getElementById(
                "registerMessage"
            );

        try {
            const response = await fetch(
                "/auth/register",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    credentials: "include",

                    body: JSON.stringify({
                        username,
                        password
                    })
                }
            );

            const data =
                await response.json();

            if (!response.ok || !data.success) {
                message.textContent =
                    data.message ||
                    "Registration failed.";

                message.classList.remove(
                    "hidden"
                );

                return;
            }

            message.textContent =
                "Account created successfully. You can now login.";

            message.classList.remove(
                "hidden"
            );

        } catch (error) {
            console.error(
                "Register error:",
                error
            );

            message.textContent =
                "Unable to connect to the server.";

            message.classList.remove(
                "hidden"
            );
        }
    }

    // ========================================
    // LOGOUT
    // ========================================

    async function logout() {
        try {
            await fetch(
                "/api/logout",
                {
                    method: "POST",
                    credentials: "include"
                }
            );
        } catch (error) {
            console.error(
                "Logout error:",
                error
            );
        }

        currentUser = null;

        document
            .getElementById("loginSection")
            .classList.remove("hidden");

        document
            .getElementById("registerSection")
            .classList.remove("hidden");

        document
            .getElementById("userSection")
            .classList.add("hidden");

        document
            .getElementById("websiteSection")
            .classList.add("hidden");

        document
            .getElementById("createPostSection")
            .classList.add("hidden");

        document
            .getElementById("staffSection")
            .classList.add("hidden");
    }

    // ========================================
    // CATEGORY
    // ========================================

    function selectCategory(category) {
        currentCategory = normalizeCategory(category);

        const title =
            document.getElementById("postsTitle");

        if (currentCategory === "all") {
            title.textContent = "0rel’s Mods";
        } else {
            title.textContent = category;
        }

        loadPosts();
    }

    // ========================================
    // NORMALIZE CATEGORY
    // ========================================

    function normalizeCategory(category) {
        return String(category || "")
            .trim()
            .toLowerCase()
            .replace(/[’']/g, "'");
    }

    // ========================================
    // LOAD POSTS
    // ========================================

    async function loadPosts() {
        const postsContainer =
            document.getElementById("posts");

        postsContainer.innerHTML =
            "<p>Loading...</p>";

        try {
            const response =
                await fetch(
                    "/api/posts",
                    {
                        credentials: "include",
                        cache: "no-store"
                    }
                );

            const data =
                await response.json();

            const posts =
                Array.isArray(data.posts)
                    ? data.posts
                    : [];

            displayPosts(posts);

        } catch (error) {
            console.error(
                "Load posts error:",
                error
            );

            postsContainer.innerHTML =
                "<p>Failed to load posts.</p>";
        }
    }

    // ========================================
    // DISPLAY POSTS
    // ========================================

    function displayPosts(posts) {
        const container =
            document.getElementById("posts");

        const selectedCategory =
            normalizeCategory(currentCategory);

        const filtered =
            posts.filter(post => {

                const postCategory =
                    normalizeCategory(
                        post.category
                    );

                if (selectedCategory === "all") {
                    return postCategory === "all";
                }

                return (
                    postCategory ===
                    selectedCategory
                );
            });

        if (filtered.length === 0) {
            container.innerHTML =
                "<p>No posts in this category.</p>";

            return;
        }

        container.innerHTML =
            filtered
                .map(post => {

                    let fileHTML = "";

                    if (
                        post.file &&
                        post.file.url
                    ) {
                        const fileName =
                            post.file.originalName ||
                            post.file.fileName ||
                            "Download File";

                        fileHTML = `
                            <div class="file-box">
                                <a
                                    href="${escapeHTML(post.file.url)}"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                >
                                    ${escapeHTML(fileName)}
                                </a>
                            </div>
                        `;
                    }

                    let staffButtons = "";

                    if (isStaffUser()) {
                        staffButtons = `
                            <div>
                                <button
                                    onclick="editPost('${escapeHTML(post.id)}')"
                                >
                                    Edit
                                </button>

                                <button
                                    onclick="deletePost('${escapeHTML(post.id)}')"
                                >
                                    Delete
                                </button>
                            </div>
                        `;
                    }

                    return `
                        <article class="post">

                            <h3>
                                ${escapeHTML(post.title || "")}
                            </h3>

                            <div class="post-meta">
                                Category:
                                ${escapeHTML(post.category || "")}
                                <br>
                                Author:
                                ${escapeHTML(post.author || "Unknown")}
                                <br>
                                ${
                                    post.createdAt
                                        ? new Date(
                                            post.createdAt
                                        ).toLocaleString()
                                        : ""
                                }
                            </div>

                            <div class="post-text">
                                ${escapeHTML(post.text || "")}
                            </div>

                            ${fileHTML}

                            ${staffButtons}

                        </article>
                    `;
                })
                .join("");
    }

    // ========================================
    // CREATE POST
    // ========================================

    async function createPost() {
        if (!isStaffUser()) {
            return;
        }

        const category =
            document
                .getElementById("postCategory")
                .value;

        const title =
            document
                .getElementById("postTitle")
                .value
                .trim();

        const text =
            document
                .getElementById("postText")
                .value
                .trim();

        const fileInput =
            document.getElementById("postFile");

        const message =
            document.getElementById("postMessage");

        if (!category || !title || !text) {
            message.textContent =
                "Category, title and text are required.";

            message.classList.remove("hidden");

            return;
        }

        const formData =
            new FormData();

        formData.append(
            "category",
            category
        );

        formData.append(
            "title",
            title
        );

        formData.append(
            "text",
            text
        );

        if (
            fileInput.files &&
            fileInput.files.length > 0
        ) {
            formData.append(
                "file",
                fileInput.files[0]
            );
        }

        try {
            const response =
                await fetch(
                    "/api/posts",
                    {
                        method: "POST",
                        credentials: "include",
                        body: formData
                    }
                );

            const data =
                await response.json();

            if (!response.ok || !data.success) {
                message.textContent =
                    data.message ||
                    "Failed to create post.";

                message.classList.remove(
                    "hidden"
                );

                return;
            }

            message.textContent =
                "Post created successfully.";

            message.classList.remove(
                "hidden"
            );

            document
                .getElementById("postTitle")
                .value = "";

            document
                .getElementById("postText")
                .value = "";

            document
                .getElementById("postFile")
                .value = "";

            document
                .getElementById("fileName")
                .textContent =
                "No file selected";

            currentCategory =
                normalizeCategory(category);

            document
                .getElementById("postsTitle")
                .textContent =
                category === "all"
                    ? "0rel’s Mods"
                    : category;

            await loadPosts();

        } catch (error) {
            console.error(
                "Create post error:",
                error
            );

            message.textContent =
                "Unable to connect to the server.";

            message.classList.remove(
                "hidden"
            );
        }
    }

    // ========================================
    // SELECT FILE
    // ========================================

    function showSelectedFile() {
        const input =
            document.getElementById("postFile");

        const fileName =
            document.getElementById("fileName");

        if (
            input.files &&
            input.files.length > 0
        ) {
            fileName.textContent =
                input.files[0].name;
        } else {
            fileName.textContent =
                "No file selected";
        }
    }

    // ========================================
    // EDIT POST
    // ========================================

    async function editPost(id) {
        if (!isStaffUser()) {
            return;
        }

        const newTitle =
            prompt(
                "Enter the new post title:"
            );

        if (newTitle === null) {
            return;
        }

        const newText =
            prompt(
                "Enter the new post text:"
            );

        if (newText === null) {
            return;
        }

        try {
            const response =
                await fetch(
                    `/api/posts/${encodeURIComponent(id)}`,
                    {
                        method: "PUT",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        credentials:
                            "include",

                        body: JSON.stringify({
                            category:
                                currentCategory,
                            title:
                                newTitle,
                            text:
                                newText
                        })
                    }
                );

            const data =
                await response.json();

            if (!response.ok || !data.success) {
                alert(
                    data.message ||
                    "Failed to edit post."
                );

                return;
            }

            await loadPosts();

        } catch (error) {
            console.error(
                "Edit post error:",
                error
            );

            alert(
                "Unable to connect to the server."
            );
        }
    }

    // ========================================
    // DELETE POST
    // ========================================

    async function deletePost(id) {
        if (!isStaffUser()) {
            return;
        }

        const confirmed =
            confirm(
                "Are you sure you want to delete this post?"
            );

        if (!confirmed) {
            return;
        }

        try {
            const response =
                await fetch(
                    `/api/posts/${encodeURIComponent(id)}`,
                    {
                        method: "DELETE",
                        credentials: "include"
                    }
                );

            const data =
                await response.json();

            if (!response.ok || !data.success) {
                alert(
                    data.message ||
                    "Failed to delete post."
                );

                return;
            }

            await loadPosts();

        } catch (error) {
            console.error(
                "Delete post error:",
                error
            );

            alert(
                "Unable to connect to the server."
            );
        }
    }

    // ========================================
    // STAFF
    // ========================================

    function openStaff() {
        window.location.href = "/staff";
    }

    // ========================================
    // ESCAPE HTML
    // ========================================

    function escapeHTML(value) {
        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // ========================================
    // START
    // ========================================

    checkUser();
</script>

</body>
</html>
